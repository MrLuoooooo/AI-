server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"
  cors_origins:
    - "*"
  rate_limit_rps: 10.0

auth:
  api_key: ""

model_provider:
  mode: "cloud"
  timeout: 120s
  local:
    enabled: false
    base_url: "http://localhost:11434"
    chat_model: ""
    embedding_model: ""
  cloud:
    enabled: true
    type: "openai"
    api_key: ""           # 从环境变量 GOAGENT_MODEL_PROVIDER_CLOUD_API_KEY 读取
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    chat_model: "qwen-vl-plus"
    embedding_model: ""

# 视觉助手配置
vision:
  enabled: true
  frame_interval: 1000    # 帧采样间隔 ms（1fps）
  frame_quality: 30       # JPEG 质量
  max_frame_width: 640    # 缩放最大宽度
  vad_mode: 1             # VAD 模式 0-3
  vad_frame_ms: 30        # VAD 帧长度
  vad_silence_ms: 800     # 静默判定阈值 ms
  max_token_per_min: 0    # TPM 限制（0=不限）
  max_sessions: 10        # 最大并发会话
  system_prompt: |
    你是一个 AI 视觉助手。请根据摄像头画面和用户的语音输入，用中文简洁回答。
    可以描述你看到的内容、回答用户关于画面中事物的提问。
    每次回复控制在 2-3 句话内，保持自然对话风格。
  vision_model: "qwen-vl-plus"
  detail: "low"           # OpenAI Vision detail: low/high/auto

log:
  level: "debug"
  file_path: "./logs/vision-assistant.log"
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true
