server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"
  cors_origins:
    - "*"
  rate_limit_rps: 10.0

auth:
  api_key: ""

model_provider:
  mode: "cloud"
  timeout: 120s
  local:
    enabled: false
    base_url: "http://localhost:11434"
    chat_model: ""
    embedding_model: ""
  cloud:
    enabled: true
    type: "openai"
    api_key: ""           # 从环境变量读取
    base_url: ""           # 从环境变量 LLM_BASE_URL 读取
    chat_model: ""         # 从环境变量 LLM_CHAT_MODEL 读取
    embedding_model: ""

# 视觉助手配置
vision:
  enabled: true
  frame_interval: 1000    # 帧采样间隔 ms（1fps）
  frame_quality: 30       # JPEG 质量
  max_frame_width: 1280   # 缩放最大宽度
  vad_mode: 1             # VAD 模式 0-3
  vad_frame_ms: 30        # VAD 帧长度
  vad_silence_ms: 800     # 静默判定阈值 ms
  max_token_per_min: 0    # TPM 限制（0=不限）
  max_sessions: 10        # 最大并发会话
  system_prompt: |
    你是 AI 视觉助手。根据摄像头画面和用户语音，用中文简洁回答（2-3句话）。
    优先观察人物动作（挥手/静止/走动）、人脸位置、明显物体和颜色。
    画面不清晰时诚实说"不太确定"，禁止编造细节（文字、建筑结构、标牌等）。
  vision_model: ""         # 从环境变量 LLM_VISION_MODEL 读取
  detail: "low"           # OpenAI Vision detail: low/high/auto

log:
  level: "debug"
  file_path: "./logs/vision-assistant.log"
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true
