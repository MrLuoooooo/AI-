services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vision-backend
    expose:
      - "8080"
    environment:
      - CONFIG_PATH=/app/configs
      - GOAGENT_MODEL_PROVIDER_CLOUD_API_KEY=${GOAGENT_MODEL_PROVIDER_CLOUD_API_KEY}
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vision-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  app_logs:
